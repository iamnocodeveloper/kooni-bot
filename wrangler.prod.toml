# Config TEMPORAL de despliegue para la instalación real
# kooni-bot-joel-nocode-ec53aa (generada para release; no commitear)
name = "kooni-bot-joel-nocode-ec53aa"
main = "src/index.ts"
compatibility_date = "2026-05-01"
compatibility_flags = ["nodejs_compat"]

[ai]
binding = "AI"

[[durable_objects.bindings]]
name = "AGENT"
class_name = "SupportAgent"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SupportAgent"]

[[d1_databases]]
binding = "DB"
database_name = "kooni_joel_nocode_ec53aa_db"
database_id = "03074590-096f-4747-b2ed-095f13219dfa"

[[vectorize]]
binding = "KB"
index_name = "kooni_joel_nocode_ec53aa_kb"

[vars]
BOT_INSTANCE_ID = "ec53aa"
BOT_LANGUAGE = "es-MX"
BOT_NAME = "Kooni"
BOT_TIER = "free"
BUFFER_SECONDS = "15"
BUSINESS_NAME = "Joel Araujo - Nocodeveloper"
DASHBOARD_BASE_URL = "https://kooni-bot-joel-nocode-ec53aa.joeldavidar.workers.dev"
LLM_PROVIDER = "openai"

# Cron diario (3am UTC): purga, insights, flywheel, copiloto y el REPORTE
# NOCTURNO. La instalación lo tenía perdido — sin esto el reporte nunca corre.
[triggers]
crons = ["0 3 * * *"]
